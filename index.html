<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SiGML Animator (CWASA)</title>
<link rel="stylesheet" href="cwasa.css">
<style>
    body {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
    }
    .avatar-wrap {
        width: 400px;
        height: 400px;
        flex-shrink: 0;
    }
    .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 520px;
    }
    .panel {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 18px;
    }
    .panel label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }
    h3 {
        margin: 4px 0 2px 0;
    }
    select#exampleSelect {
        max-width: 100%;
    }
    textarea#sigmlInput {
        width: 100%;
        height: 220px;
        font-family: monospace;
        font-size: 0.85em;
        box-sizing: border-box;
    }
    .buttons {
        display: flex;
        gap: 8px;
    }
    #statusLog {
        width: 100%;
        height: 130px;
        overflow-y: auto;
        border: 1px solid #999;
        background: #fafafa;
        font-family: monospace;
        font-size: 0.8em;
        padding: 6px;
        box-sizing: border-box;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<div class="avatar-wrap">
    <div class="CWASAAvatar av0"></div>
</div>

<div class="controls">

    <h3>Playback Controls</h3>
    <div class="panel">
        <label>Avatar: <span class="CWASAAvMenu av0"></span></label>
        <label>Ambient: <span class="CWASAAmbBox av0"></span></label>
    </div>
    <div class="panel">
        <label>Speed (log<sub>2</sub>): <span class="CWASASpeed av0"></span></label>
    </div>
    <div class="panel">
        <span class="CWASAPlayExtra av0"></span>
        <label>Frame: <span class="CWASAFrames av0"></span></label>
    </div>
    <div class="panel">
        <span class="CWASAProgress av0"></span>
    </div>

    <h3>SiGML Text</h3>
    <label>Examples:
        <select id="exampleSelect">
            <option value="">-- choose an example --</option>
            <option value="examples/iTakeMug.sigml">I Take Mug (G-SiGML)</option>
            <option value="examples/scotland-H.sigml">Scotland (H-SiGML / HamNoSys)</option>
            <option value="examples/blenderStory.sigml">Blender Story (G-SiGML, long)</option>
            <option value="examples/welkom-ngt.sigml">Welkom NGT (G-SiGML, long, Dutch)</option>
            <option value="examples/ref-ref.sigml">Ref-ref chain (reference only, will not animate)</option>
            <option value="examples/signing-ref-local-test.sigml">Signing-ref local test (reference only, will not animate)</option>
        </select>
    </label>
    <textarea id="sigmlInput" placeholder="Paste or load a SiGML snippet here..."></textarea>

    <div class="buttons">
        <button id="playBtn" disabled>Animate</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <h3>Status</h3>
    <div id="statusLog"></div>
</div>

<script src="allcas.js"></script>
<script src="app.js"></script>
</body>
</html>
